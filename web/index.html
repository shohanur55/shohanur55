  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0A192F;
      font-family: Arial, Helvetica, sans-serif;
    }

    #splash-screen {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0A192F;
      color: #D1D5DB;
      transition: opacity 0.4s ease;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      text-align: center;
    }

    .splash-mark {
      position: relative;
      width: 112px;
      height: 112px;
      display: grid;
      place-items: center;
    }

    .splash-mark::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 4px solid rgba(100, 255, 218, 0.16);
      border-top-color: rgba(100, 255, 218, 0.9);
      animation: splash-spin 1.1s linear infinite;
    }

    .splash-logo {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, rgba(10, 25, 47, 0.95), rgba(8, 15, 30, 0.98));
      border: 1px solid rgba(100, 255, 218, 0.22);
      box-shadow: 0 0 0 10px rgba(100, 255, 218, 0.04);
      font-size: 2.25rem;
      font-weight: 700;
      color: #E6F1FF;
      letter-spacing: 0.04em;
      overflow: hidden;
    }

    .splash-tagline {
      font-size: 1rem;
      line-height: 1.4;
      color: #CBD5E1;
      letter-spacing: 0.02em;
    }

    @keyframes splash-spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Service worker is auto-generated by Flutter build. Cache-first strategy is applied automatically. -->
  <div id="splash-screen" aria-label="Loading portfolio">
    <div class="splash-content">
      <div class="splash-mark" aria-hidden="true">
        <div class="splash-logo">
          <img src="favicon.png" alt="Profile" style="width: 100%; height: 100%; object-fit: cover; border-radius: 50%;">
        </div>
      </div>
      <div class="splash-tagline">Loading portfolio...</div>
    </div>
  </div>

  <script>
    (function() {
      var serviceWorkerVersion = null;
      var scriptLoaded = false;
      var splashShownAt = Date.now();
      var minimumSplashDuration = 0; // Show app as soon as Flutter first-frame fires

      function hideSplashScreen() {
        var splash = document.getElementById('splash-screen');
        if (!splash) return;

        var elapsed = Date.now() - splashShownAt;
        var delay = Math.max(0, minimumSplashDuration - elapsed);

        setTimeout(function() {
          splash.style.opacity = '0';
          splash.style.transition = 'opacity 0.4s ease';
          setTimeout(function() { splash.remove(); }, 400);
        }, delay);
      }

      function loadMainDartJs() {
        if (scriptLoaded) return;
        scriptLoaded = true;
        var scriptTag = document.createElement('script');
        scriptTag.src = 'main.dart.js';
        scriptTag.type = 'application/javascript';
        document.body.appendChild(scriptTag);
      }

      window.addEventListener('flutter-first-frame', hideSplashScreen);

      if ('serviceWorker' in navigator) {
        window.addEventListener('flutter-first-frame', function() {
          navigator.serviceWorker.register('flutter_service_worker.js?v=' + serviceWorkerVersion);
        });
      }

      if (document.readyState === 'complete' || document.readyState === 'interactive') {
        requestAnimationFrame(loadMainDartJs);
      } else {
        window.addEventListener('DOMContentLoaded', function() {
          requestAnimationFrame(loadMainDartJs);
        });
      }
    })();
  </script>
</body>
</html>
